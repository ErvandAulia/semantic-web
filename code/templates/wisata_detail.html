<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Detail Tempat Wisata</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">Ontologi Pariwisata Solo</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">Beranda</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/ontology">Ontologi</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/wisata">Tempat Wisata</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- CONTENT -->
<div class="container my-5">
    <div class="card shadow-sm">
        <div class="card-body">

            <h2 class="fw-bold mb-3">{{ nama }}</h2>

            <table class="table">
                <tr>
                    <th width="30%">Lokasi</th>
                    <td>{{ lokasi }}</td>
                </tr>
                <tr>
                    <th>Daya Tarik</th>
                    <td>{{ daya_tarik }}</td>
                </tr>
                <tr>
                    <th>Rating</th>
                    <td>{{ rating }}</td>
                </tr>
                <tr>
                    <th>Fasilitas</th>
                    <td>
                        {% if fasilitas %}
                            <ul>
                                {% for f in fasilitas %}
                                    <li>{{ f }}</li>
                                {% endfor %}
                            </ul>
                        {% else %}
                            -
                        {% endif %}
                    </td>
                </tr>
            </table>

            <a href="/wisata" class="btn btn-secondary mt-3">
                Kembali ke Daftar Tempat Wisata
            </a>

        </div>
    </div>
</div>

</body>
</html>
