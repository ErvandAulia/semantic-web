<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Detail Transportasi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">Ontologi Pariwisata Solo</a>
        
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center">
                
                <li class="nav-item">
                    <a class="nav-link" href="/">Beranda</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/ontology">Ontologi</a>
                </li>
                <li class="nav-item ms-lg-2">
                    <a class="btn btn-warning btn-sm fw-bold px-3 rounded-pill" href="/search">
                        🤖 Tanya AI
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-5">
    <div class="mb-4">
        <h2 class="fw-bold">{{ nama }}</h2>
        <span class="badge bg-success">{{ jenis }}</span>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-white fw-bold">Informasi Operasional</div>
                <div class="card-body">
                    <table class="table table-borderless">
                        <tr><th width="30%">Jenis Armada</th><td>: {{ jenis }}</td></tr>
                        <tr><th>Jam Operasional</th><td>: {{ jam }}</td></tr>
                    </table>
                </div>
            </div>
            
            <div class="d-grid"><a href="/transportasi" class="btn btn-secondary">Kembali ke Daftar</a></div>
        </div>
    </div>
</div>
</body>
</html>
