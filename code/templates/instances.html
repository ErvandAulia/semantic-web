<!DOCTYPE html>
<html>
<head>
    <title>Instances: {{ class_name }}</title>
    <link rel="stylesheet" 
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h1 class="text-center mb-4">Instances dari Class: <strong>{{ class_name }}</strong></h1>

    <div class="card shadow p-4">
        {% if instances|length == 0 %}
            <p class="text-danger text-center">Tidak ada instance.</p>
        {% else %}
            <ul class="list-group">
                {% for inst in instances %}
                <li class="list-group-item">
                    {{ inst.name }}
                </li>
                {% endfor %}
            </ul>
        {% endif %}
    </div>

    <div class="text-center mt-4">
        <a href="/classes" class="btn btn-secondary">Kembali ke Daftar Class</a>
    </div>
</div>

</body>
</html>
