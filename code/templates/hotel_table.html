<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Daftar Hotel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">Ontologi Pariwisata Solo</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">Beranda</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/ontology">Ontologi</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/hotel">Hotel</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- CONTENT -->
<div class="container my-5">
    <h2 class="text-center fw-bold mb-4">Daftar Hotel di Kota Surakarta</h2>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>Nama Hotel</th>
                        <th>Lokasi</th>
                        <th>Kategori Bintang</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    {% for h in hotels %}
                    <tr>
                        <td>{{ h.nama }}</td>
                        <td>{{ h.lokasi }}</td>
                        <td>{{ h.bintang }}</td>
                        <td>
                            <a href="/instance/{{ h.id }}" class="btn btn-sm btn-primary">
                                Lihat Detail
                            </a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- FOOTER -->
<!-- <footer class="bg-dark text-white text-center py-3">
    <small>© 2025 — Sistem Ontologi Pariwisata Kota Surakarta</small>
</footer> -->

</body>
</html>
