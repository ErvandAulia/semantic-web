<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Ontologi Pariwisata Kota Surakarta</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- ================= NAVBAR ================= -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">Ontologi Pariwisata Solo</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">Beranda</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/ontology">Ontologi</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/hotel">Hotel</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ================= CONTENT ================= -->
<div class="container my-5">

    <h1 class="text-center fw-bold mb-4">Daftar Class Ontologi</h1>

    <div class="card shadow-sm">
        <ul class="list-group list-group-flush">
            {% for c in all_classes %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                {{ c.name }}
                <a href="/class/{{ c.name }}" class="btn btn-sm btn-primary">
                    Lihat Instance
                </a>
            </li>
            {% endfor %}
        </ul>
    </div>

</div>

<!-- ================= FOOTER ================= -->
<footer class="bg-dark text-white text-center py-3">
    <small>© 2025 — Sistem Ontologi Pariwisata Kota Surakarta</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
